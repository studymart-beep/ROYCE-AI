[package]
name = "royce-ai-desktop"
version = "1.0.0"
description = "Royce AI desktop client (Tauri v2)"
authors = ["Royce Marketing Agency"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
