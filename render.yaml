# Render blueprint for the Royce AI backend. One service serves BOTH the API and the web apps
# (/workspace, /m, the PWA shell). Nothing here is deployed by this repo; you create the service.
# Secrets are NOT in this file. Set each value in the Render dashboard, by name only.
services:
  - type: web
    name: royce-ai
    runtime: python
    plan: starter            # a persistent disk requires a paid instance type
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    disk:
      name: royce-data
      mountPath: /var/data/royce
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: ROYCE_DATA_DIR            # sqlite, json stores, audit log, backups live here (on the disk)
        value: /var/data/royce
      - key: ALLOWED_ORIGINS           # comma-separated origins for any separate static host
        sync: false
      - key: WORKSPACE_TOKEN           # owner token: set in the dashboard, never commit it
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: OPENROUTER_MODEL
        sync: false
      - key: OWNER_CHAT_ID
        sync: false
      - key: TELEGRAM_BOT_TOKEN       # bot token from BotFather: entered in the dashboard, never committed.
        sync: false                  # The bot runs inside this web service (lifespan thread), so no worker service.
