<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Royce AI</title>
<meta name="theme-color" content="#0d0d0f">
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/mascot.png">
<link rel="icon" href="/static/mascot.png" type="image/png">
<link rel="stylesheet" href="/static/workspace.css">
</head>
<body>
<div class="app" id="app">
  <nav class="rail" aria-label="Main">
    <div class="rail-top">
      <button class="rail-item" data-page="bots" aria-label="Bots"><span class="rail-ico" aria-hidden="true">&#9673;</span><span class="rail-label">Bots</span></button>
      <button class="rail-item" data-page="sessions" aria-label="Sessions"><span class="rail-ico" aria-hidden="true">&#9776;</span><span class="rail-label">Sessions</span></button>
      <button class="rail-item" data-page="routines" aria-label="Routines"><span class="rail-ico" aria-hidden="true">&#8635;</span><span class="rail-label">Routines</span></button>
      <button class="rail-item" data-page="artifacts" aria-label="Artifacts"><span class="rail-ico" aria-hidden="true">&#10070;</span><span class="rail-label">Artifacts</span></button>
      <button class="rail-item" data-page="library" aria-label="Library"><span class="rail-ico" aria-hidden="true">&#9638;</span><span class="rail-label">Library</span></button>
    </div>
    <div class="rail-bottom">
      <button class="rail-item" data-page="settings" aria-label="Settings"><span class="rail-ico" aria-hidden="true">&#9881;</span><span class="rail-label">Settings</span></button>
      <a class="small muted" href="/m" style="font-size:10px">mobile</a>
      <div class="account" id="account">
        <img class="avatar" src="/static/mascot.png" alt="" width="34" height="34">
        <div class="account-text">
          <div class="account-name">Royce AI</div>
          <div class="account-usage" id="usageLine">checking usage...</div>
        </div>
      </div>
    </div>
  </nav>

  <aside class="side" id="side" aria-label="Section sidebar"></aside>

  <main class="main" id="main">
    <header class="topbar">
      <div class="topbar-title" id="pageTitle">Bots</div>
      <div class="status-pill" id="statusPill" title="Provider health">checking...</div>
    </header>
    <div class="page-body" id="pageBody" tabindex="-1"></div>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="/static/config.js"></script>
<script src="/static/api-base.js"></script>
<script src="/static/workspace.js"></script>
</body>
</html>
