<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08080a">
<title>Royce AI, offline</title>
<style>
  :root{--window:#08080a;--card:#15151a;--hair:#232329;--text:#f4f4f5;--muted:#9d9daa;--accent:#8b5cf6;--gold:#c9a24b}
  html,body{height:100%;margin:0;background:radial-gradient(700px 320px at 50% -80px,rgba(139,92,246,.12),transparent 70%),var(--window);color:var(--text);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  body{display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top) 24px env(safe-area-inset-bottom)}
  main{max-width:420px;text-align:center;background:var(--card);border:1px solid var(--hair);border-radius:18px;padding:36px 28px}
  .mark{width:60px;height:60px;margin:0 auto 18px;display:block;border-radius:16px}
  h1{font-size:22px;margin:0 0 8px;font-weight:750;letter-spacing:-.01em}
  p{margin:0 0 14px;color:var(--text)}
  .muted{color:var(--muted);font-size:15px}
  button{min-height:48px;padding:0 24px;border:0;border-radius:10px;background:linear-gradient(180deg,#9d6bff,#7c3aed);color:#fff;font:inherit;font-weight:650;font-size:16px;cursor:pointer}
  .rule{width:48px;height:3px;background:var(--gold);border-radius:2px;margin:12px auto 18px}
</style>
</head>
<body>
<main>
  <img class="mark" src="/static/mascot.png" alt="Royce AI">
  <h1>you're offline</h1>
  <div class="rule"></div>
  <p>Royce AI needs a connection to answer. Nothing was sent, and no reply was made up while you're offline.</p>
  <p class="muted">Reconnect and your chats, tasks and approvals will load again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
